name: pages

on:
  push:
    branches: [main]
    paths:
      - web/**
      - core/**
      - local/install.sh
      - docs/setup.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: web
      - run: npm run build:site
        working-directory: web
        env:
          VITE_RELEASED: "1"
      - run: cp local/install.sh web/dist-site/install.sh
      - run: cp docs/setup.md web/dist-site/setup.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
